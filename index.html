<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">個人專屬 · 台電職員考題大師 iOS 26.6 旗艦網站</title>
  <!-- KaTeX for math formula rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ios26-theme">

  <!-- Top View Mode Controller -->
  <div class="view-control-bar">
    <button class="view-btn" id="editSiteNameBtn" style="background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; font-weight:700;">
      <span>✏️</span> 自訂專屬網站名稱
    </button>
    <button class="view-btn ios26-btn" id="ios26ToggleBtn">
      <span>✨</span> iOS 26.6 全息主題
    </button>
    <button class="view-btn active" data-view="frame">
      <span>📱</span> iPhone 17 機身
    </button>
    <button class="view-btn" data-view="fullscreen">
      <span>💻</span> 全螢幕模式
    </button>
  </div>

  <!-- iPhone 17 / iOS 26 Chassis Frame -->
  <div class="iphone-frame">

    <!-- Status Bar & Dynamic Island -->
    <div class="ios-status-bar">
      <div class="status-time" id="statusTime">09:41</div>
      <div class="dynamic-island" id="dynamicIslandBox" title="點擊切換靈動島訊息">
        <div class="island-dot"></div>
        <div class="island-text" id="islandSiteText">iOS 26.6 | 專屬網站</div>
      </div>
      <div class="status-icons">
        <span>6G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="header-top">
        <div class="brand-title">
          <div class="brand-icon">⚡</div>
          <div class="brand-name" id="displaySiteName">個人專屬 · 台電考題大師</div>
        </div>
        <div class="header-badge" id="versionBadge">iOS 26.6 VIP</div>
      </div>

      <!-- Search Input -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋 108~114 年標么值、變壓器、電磁學...">
      </div>
    </div>

    <!-- Year Filter Bar -->
    <div class="filter-scroll-row" id="yearFilterRow">
      <button class="chip-btn active" data-year="ALL">全部年份 (108~114)</button>
      <button class="chip-btn" data-year="114">114 年最新</button>
      <button class="chip-btn" data-year="113">113 年</button>
      <button class="chip-btn" data-year="112">112 年</button>
      <button class="chip-btn" data-year="111">111 年</button>
      <button class="chip-btn" data-year="110">110 年</button>
      <button class="chip-btn" data-year="109">109 年</button>
      <button class="chip-btn" data-year="108">108 年</button>
    </div>

    <!-- Tab Navigation -->
    <div class="subject-nav">
      <div class="nav-item active" data-tab="subjectB">科目 B 計算題</div>
      <div class="nav-item" data-tab="subjectA">科目 A 選擇題</div>
      <div class="nav-item" data-tab="flashcards">公式卡片</div>
      <div class="nav-item" data-tab="saved">★ 收藏夾</div>
    </div>

    <!-- App Content Scrollable Container -->
    <div class="app-content" id="appContent">
      <!-- Dynamic Rendered Content -->
    </div>

    <!-- iOS Bottom Dock -->
    <div class="ios-dock">
      <div class="dock-item active">
        <span class="dock-icon">📚</span>
        <span>題庫研習</span>
      </div>
      <div class="dock-item">
        <span class="dock-icon">✏️</span>
        <span>模擬測驗</span>
      </div>
      <div class="dock-item">
        <span class="dock-icon">📊</span>
        <span>專屬分析</span>
      </div>
      <div class="dock-item">
        <span class="dock-icon">⚙️</span>
        <span>iOS 26.6</span>
      </div>
    </div>

  </div>

  <script src="js/examData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
