<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台電職員電機｜歷屆試題詳解刷題</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap"><h1>⚡ 台電職員電機｜歷屆試題詳解刷題</h1><p>108–114 年科目 A 題庫｜自動判分・錯題收藏・進度保存｜GitHub Pages 公開版</p></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="sTotal">0</b><span>目前題數</span></div><div class="stat"><b id="sDone">0</b><span>已作答</span></div><div class="stat"><b id="sRate">—</b><span>答對率</span></div><div class="stat"><b id="sFav">0</b><span>收藏／錯題</span></div></div><div class="grid"><aside class="panel"><h3>刷題設定</h3><div class="control"><label>年度</label><select id="year"><option value="all">全部</option></select></div><div class="control"><label>主題</label><select id="topic"><option value="all">全部</option></select></div><div class="control"><label>題目狀態</label><select id="status"><option value="all">全部題目</option><option value="unanswered">尚未作答</option><option value="wrong">錯題</option><option value="favorite">收藏</option><option value="answered">已作答</option></select></div><div class="control"><label>搜尋題目</label><input id="search" placeholder="例如：功率因數、MOSFET"></div><button class="btn secondary" id="random">🎲 隨機一題</button><button class="btn secondary" id="reset" style="margin-top:8px">↺ 清除本機進度</button><div class="small" style="margin-top:14px">進度只儲存在你的瀏覽器 localStorage，不會上傳。</div></aside><section><div id="quiz"></div><section class="papers"><h2>📚 題庫來源說明</h2><div class="source-note"><b>GitHub Pages 公開版不附原始 PDF。</b><br>部分題目原卷含電路圖或示意圖，純文字版可能無法完整呈現；遇到圖形題時，請搭配你合法取得的原始歷屆試題閱讀。</div></section></section></div></main><script src="data.js"></script><script src="app.js"></script></body></html>
